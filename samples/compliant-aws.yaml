apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-api
  namespace: ai-platform
  annotations:
    platform.example.com/eks-pod-identity-association: "true"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
    spec:
      serviceAccountName: inference-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/example/inference-api:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
