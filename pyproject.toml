[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-workload-identity-guard"
version = "0.1.0"
description = "Deterministic GitOps policy guard for Kubernetes workload identity"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
workload-identity-guard = "workload_identity_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
